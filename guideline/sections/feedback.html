<div class="ks-demo" style="display:grid;gap:var(--space-3)">
  <div class="alert alert-success"><span><b class="alert-title">Saved.</b> Your card is live at nfc.cool/alex.</span></div>
  <div class="alert alert-warning"><span><b class="alert-title">Seat limit reached.</b> Add seats to invite more members.</span></div>
  <div class="alert alert-danger"><span><b class="alert-title">Could not verify the domain.</b> The TXT record was not found.</span></div>
  <div class="alert alert-info"><span><b class="alert-title">Heads up.</b> Apple Wallet passes are iPhone only.</span></div>
  <div class="ks-row" style="margin-top:var(--space-2)">
    <div class="skeleton" style="width:12rem;height:1rem"></div>
    <div class="skeleton" style="width:6rem;height:1rem"></div>
  </div>
</div>
<div class="ks-basis">
  <b>One alert per tone</b>, from the same ramp as the pills, and a skeleton for anything still loading.
</div>
